name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :shared:desktopTest

  draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Depot ${TAG#v}" --notes-file .github/release-notes.md

  package:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tasks: :desktopApp:packageDmg
            label: macos-arm64
          - os: macos-15-intel
            tasks: :desktopApp:packageDmg
            label: macos-x64
          - os: windows-latest
            tasks: :desktopApp:packageMsi
            label: windows-x64
          - os: ubuntu-latest
            tasks: :desktopApp:packageDeb :desktopApp:packageRpm
            label: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: ./gradlew ${{ matrix.tasks }}
      - name: Collect installers
        run: |
          mkdir dist
          for file in desktopApp/build/compose/binaries/main/*/*; do
            case "$file" in
              *.dmg|*.msi|*.deb|*.rpm) cp "$file" "dist/Depot-${TAG#v}-${{ matrix.label }}.${file##*.}" ;;
            esac
          done
          ls -l dist
          test -n "$(ls dist)"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: gh release upload "$TAG" dist/* --clobber

  checksums:
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Depot-*"
          sha256sum Depot-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
